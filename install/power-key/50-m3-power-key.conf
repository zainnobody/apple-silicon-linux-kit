# Installed on the M3 as /etc/systemd/logind.conf.d/50-m3-power-key.conf (2026-10-31).
# The Touch ID sensor is the power key. A short press must never power off.
# Short press: ignored by logind (in a KDE session, KDE locks the screen: PowerButtonAction=32 in ~/.config/powerdevilrc).
# Hold about 5 s (the systemd long-press time, fixed): power off. A 10 s hold is Apple's hardware power-off.
# PowerKeyIgnoreInhibited=yes: the long press also works while KDE holds the power-key inhibitor.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
PowerKeyIgnoreInhibited=yes
