# /etc/dracut.conf.d/m3-apple-dart.conf
# Load the Apple DART (IOMMU) driver in the initramfs before udev binds its consumers, so
# apple-admac, apple_aop and dwc3_apple find their IOMMU at bind time instead of a late probe
# ("late IOMMU probe at driver bind, something fishy here!" plus a WARNING at iommu.c:655).
force_drivers+=" apple_dart "
