name: Bug report
description: Something in the kit or the guide does not work on your Mac.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This is a community project, not Asahi Linux. Please do not send these problems to the Asahi developers.

        **Touch ID problem?** Do nothing more to the Secure Enclave storage, and never restore an older xART backup. Read [GUIDE.md section 6](https://github.com/zainnobody/apple-silicon-linux-kit/blob/main/GUIDE.md#6-touch-id) first.

        Before you paste logs, remove serial numbers, MAC addresses, user names and host names.
  - type: input
    id: mac
    attributes:
      label: Mac model
      description: "Model and board, for example MacBook Pro 16-inch M3 Pro (J516S). Run: cat /proc/device-tree/model"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: Fedora Asahi Remix 44 (KDE)
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel
      description: "Run: uname -r"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Install stages or kernel build
        - GPU or Mesa
        - Memory speed
        - Touch ID
        - Video decode
        - Displays and ports
        - Fans
        - Bluetooth
        - Camera or audio
        - The guide text
        - Other
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: Guide step
      placeholder: Step 5, stage C
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened.
    validations:
      required: true
  - type: textarea
    id: selftest
    attributes:
      label: Self-test output
      description: "Run tests/m3-selftest.sh --quick and paste the summary line and every FAIL and WARN line."
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "The command output, or for example: journalctl -b -p warning | tail -100"
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I read the Known problems section of GUIDE.md.
          required: true
        - label: I removed serial numbers, MAC addresses and names from the logs.
          required: true
