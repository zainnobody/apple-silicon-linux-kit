# Installed as /etc/systemd/system/fprintd.service.d/aurora-private.conf by m3-touchid-install.
# fprintd uses the private libfprint with the Apple SEP driver and starts after the module is loaded,
# because the driver finds /dev/sep-bio only when fprintd starts. Wants, not Requires: if Touch ID fails
# to come up, fprintd still starts (without a reader) and the password prompts are not held back.
[Unit]
After=m3-touchid.service
Wants=m3-touchid.service

[Service]
Environment=LD_LIBRARY_PATH=/opt/aurora-sep/lib64
DeviceAllow=/dev/sep-bio rw
ExecStart=
ExecStart=/usr/libexec/fprintd --no-timeout
